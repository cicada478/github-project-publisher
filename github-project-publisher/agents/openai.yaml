interface:
  display_name: "GitHub 项目发布助手"
  short_description: "检查、整理并安全发布项目，按实际风险调整流程强度"
  default_prompt: "Use $github-project-publisher to audit this project for GitHub, recommend the narrowest suitable publication mode, and make no changes or uploads unless I explicitly request them."

policy:
  allow_implicit_invocation: true
